<div class="download-panel">
    <div class="download-header">
        <h2>Results for {{ query|default('your search') }}</h2>
        <p>Click any thumbnail to download the saved image. The files are cached locally so repeated searches are faster.</p>
    </div>
    <div class="gallery">
        {% for url in image_urls %}
            <div class="card">
                <a href="{{ url }}" download>
                    <img src="{{ url }}" alt="Image {{ loop.index }}">
                </a>
                <div class="card-footer">
                    <span>Image {{ loop.index }}</span>
                    <a class="button" href="{{ url }}" download>Download</a>
                </div>
            </div>
        {% endfor %}
    </div>
    <a class="button secondary" href="/">Search again</a>
</div>
