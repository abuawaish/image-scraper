<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplash Image Scraper</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #090b16;
            color: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, .22), transparent 30%),
                        radial-gradient(circle at bottom right, rgba(168, 85, 247, .2), transparent 28%),
                        #020617;
        }

        .page {
            width: 100%;
            max-width: 980px;
        }

        .hero {
            width: 100%;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 35px 80px rgba(15, 23, 42, 0.4);
            border-radius: 32px;
            padding: 38px;
            backdrop-filter: blur(18px);
            animation: float 10s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(2.5rem, 4vw, 4.2rem);
            margin: 0 0 16px;
            line-height: 1.05;
            background: linear-gradient(130deg, #6ee7b7, #7c3aed 40%, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.lead {
            margin: 0 0 32px;
            max-width: 760px;
            font-size: 1.05rem;
            color: #cbd5e1;
            line-height: 1.75;
        }

        .form-card {
            display: grid;
            gap: 24px;
            margin-top: 8px;
        }

        label {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            min-height: 54px;
            padding: 0 18px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.76);
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        input[type="text"]:focus {
            border-color: rgba(124, 58, 237, 0.8);
            box-shadow: 0 0 0 6px rgba(124, 58, 237, 0.12);
            transform: translateY(-1px);
        }

        button {
            margin-top: 12px;
        }

        button {
            min-height: 52px;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            box-shadow: 0 16px 30px rgba(56, 189, 248, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.24);
        }

        #loadingMessage,
        #errorMessage {
            display: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.98rem;
        }

        #loadingMessage {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.18);
            color: #e0f2fe;
        }

        #errorMessage {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #fee2e2;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #result {
            margin-top: 28px;
        }

        .download-panel {
            display: grid;
            gap: 24px;
            padding: 28px;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            animation: fadeIn 0.5s ease;
        }

        .download-header h2 {
            margin: 0 0 6px;
            font-size: 2rem;
            color: #f8fafc;
        }

        .download-header p {
            margin: 0;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            display: grid;
            gap: 14px;
            background: rgba(13, 27, 47, 0.9);
            border-radius: 22px;
            padding: 16px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.25);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 18px;
            filter: saturate(1.1) contrast(1.05);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .card-footer span {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .button,
        .button.secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .button {
            background: linear-gradient(135deg, #38bdf8, #7c3aed);
            color: #fff;
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.18);
        }

        .button:hover,
        .button.secondary:hover {
            transform: translateY(-2px);
        }

        .button.secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero">
            <h1>Unsplash Image Scraper</h1>
            <p class="lead">Search for images on Unsplash and download top results instantly. This version uses modern colors, smooth motion, and presents the results right on the page.</p>
            <div class="form-card">
                <form id="scrapeForm" action="/scrape" method="POST">
                    <label for="query">Search term</label>
                    <input type="text" id="query" name="query" placeholder="e.g. dog, city, landscape" required autocomplete="off">
                    <button type="submit">Scrape Images</button>
                </form>
                <div id="errorMessage"{% if error %} style="display:block;"{% endif %}>{{ error or '' }}</div>
                <div id="loadingMessage"><span class="spinner"></span> Fetching images from Unsplash...</div>
            </div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        $(function() {
            $('#loadingMessage').hide();
            $('#errorMessage').hide();

            $('#scrapeForm').on('submit', function(event) {
                event.preventDefault();
                $('#loadingMessage').show();
                $('#errorMessage').hide().text('');
                $('#result').empty();

                $.ajax({
                    type: 'POST',
                    url: '/scrape',
                    data: $(this).serialize(),
                    success: function(data) {
                        $('#result').html(data);
                    },
                    error: function(xhr) {
                        $('#errorMessage').show().text('An error occurred while processing your request. Please try again.');
                    },
                    complete: function() {
                        $('#loadingMessage').hide();
                    }
                });
            });
        });
    </script>
</body>
</html>
